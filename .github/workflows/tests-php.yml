# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: PHP Tests

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.php'
      - 'tests/**'
      - 'composer.json'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml.dist'
      - '.wp-env.test.json'
      - '.github/workflows/tests-php.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-php:
    name: PHPUnit - WP ${{ matrix.core || 'latest' }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]
        # Minimum supported WordPress (style.css "Requires at least") and latest stable.
        core: [ 'WordPress/WordPress#6.3', null ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Launch test environment
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: ${{ matrix.core }}
        run: npm run env:start-ci

      - name: Run PHPUnit
        run: npm run test:php
